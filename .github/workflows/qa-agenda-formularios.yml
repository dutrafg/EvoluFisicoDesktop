name: QA Agenda e Formulários
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/EvoluFisico.Desktop/wwwroot/**'
      - 'tests/windows-agenda-home-summary.cjs'
      - 'tests/windows-release-911-beta4.cjs'
      - 'tests/windows-stable-1-0.cjs'
      - 'tests/windows-sync-evolufisico2-1-0.cjs'
      - 'scripts/build-windows.ps1'
      - 'tests/desktop-integration.cjs'
      - 'tests/windows-billing-navigation-91.cjs'
      - 'installer/EvoluFisico.iss'
      - 'src/EvoluFisico.Desktop/MainWindow.xaml.cs'
      - 'tests/windows-home-layout.cjs'
      - 'tests/windows-agenda-recorrencia.cjs'
      - '.github/workflows/qa-agenda-formularios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/06-dashboard.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/26-simple-interface.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/34-pre-cadastro.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/32-forms-clean.js
      - name: Validate frontend resources
        run: python scripts/verify_frontend.py
      - name: Validate stable 1.0 analysis algorithms and Windows release compatibility
        run: node tests/windows-stable-1-0.cjs
      - name: Validate Evolufisico2 adherence, history and perimetry synchronization
        run: node tests/windows-sync-evolufisico2-1-0.cjs
      - name: Validate legacy desktop theme, movable cards and preregistration
        run: node tests/windows-release-911-beta4.cjs
      - name: Validate native desktop bridges and version alignment
        run: node tests/desktop-integration.cjs
      - name: Validate billing navigation and version display
        run: node tests/windows-billing-navigation-91.cjs
      - name: Test agenda metrics and responsive layout
        run: node tests/windows-agenda-home-summary.cjs
      - name: Verify existing card layout
        run: node tests/windows-home-layout.cjs
      - name: Verify recurring appointments and attendance
        run: node tests/windows-agenda-recorrencia.cjs
      - name: Verify card resizing
        run: node tests/windows-card-resize.cjs
      - name: Verify form integration
        run: node tests/forms-windows-integration.cjs
