name: Windows Desktop Build
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate frontend and resource references
        shell: pwsh
        run: python scripts/verify_frontend.py

      - name: Validate desktop integrations
        shell: pwsh
        run: node tests/desktop-integration.cjs

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Protect legacy evaluation, billing and master password compatibility
        run: node tests/legacy-vault-compatibility.cjs

      - name: Run 30 Windows stability safety gates
        run: node tests/windows-stable-gates.cjs

      - name: Validate migration JavaScript syntax
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/29-legacy-migration.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/30-indexeddb-inventory.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/31-indexeddb-snapshot.js

      - name: Exercise IndexedDB migration with synthetic records
        run: node tests/indexeddb-snapshot-runtime.cjs

      - name: Test IndexedDB encrypted snapshot safety
        run: node tests/indexeddb-snapshot.cjs

      - name: Test opt-in legacy data snapshot
        run: node tests/legacy-migration.cjs

      - name: Test desktop SQLite JavaScript bridge
        run: node tests/native-storage-client.cjs

      - name: Run native encrypted SQLite integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/StorageSmoke/StorageSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted SQLite integration tests failed' }

      - name: Verify Windows application icon
        shell: pwsh
        run: |
          $ico = 'src/EvoluFisico.Desktop/Assets/EvoluFisico.ico'
          if (!(Test-Path $ico)) { throw 'Windows icon was not generated' }
          $bytes = [IO.File]::ReadAllBytes($ico)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Invalid Windows ICO file'
          }
          $exe = 'publish/win-x64/EvoluFisico.Desktop.exe'
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if (-not $icon) { throw 'Windows EXE icon missing' }
          $icon.Dispose()
          Write-Host 'Windows icon resources verified'

      - name: Test packaged offline assets and print cleanup
        shell: pwsh
        working-directory: publish/win-x64/wwwroot
        run: |
          node ../../../tests/service-worker.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Service Worker regression failed' }
          node ../../../tests/print-cleanup.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Print regression failed' }
          node ../../../tests/flows-regression.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation, PDF and backup flow regression failed' }

      - name: Verify executable and resources
        shell: pwsh
        run: |
          $publish = 'publish/win-x64'
          foreach ($file in @('EvoluFisico.Desktop.exe','wwwroot/index.html','wwwroot/evolufisico.html','wwwroot/icon-192.png','wwwroot/icon-512.png','wwwroot/sw.js','wwwroot/desktop-version.json')) {
            if (!(Test-Path (Join-Path $publish $file))) { throw "Missing published file: $file" }
          }
          $manifest = Get-Content (Join-Path $publish 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          $expected = 'desktop-v9.0-beta-' + '${{ github.sha }}'.Substring(0,7)
          if ($manifest.tag -ne $expected) { throw "Version manifest mismatch: $($manifest.tag) vs $expected" }
          Write-Host 'Portable Windows application validated for packaging'

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-9.0-Windows-Portable
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup not found: $iscc" }
          & $iscc installer/EvoluFisico.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-output -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not generated' }
          if ($installer.Length -lt 100KB) { throw 'Installer is unexpectedly small' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          Write-Host "Installer ready: $($installer.Name) ($($installer.Length) bytes)"

      - name: Smoke test silent installation and removal
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter '*.exe' -File | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'EvoluFisicoDesktopSmoke'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          foreach ($file in @('EvoluFisico.Desktop.exe','wwwroot/index.html','wwwroot/sw.js','wwwroot/desktop-version.json')) {
            if (!(Test-Path (Join-Path $target $file))) { throw "Installed file missing: $file" }
          }
          $installedVersion = Get-Content (Join-Path $target 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          $expectedVersion = 'desktop-v9.0-beta-' + '${{ github.sha }}'.Substring(0,7)
          if ($installedVersion.tag -ne $expectedVersion) { throw 'Installed version does not match release version' }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed: $($remove.ExitCode)" }
          Write-Host 'Silent installation and uninstall smoke tests passed'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-9.0-Windows-Setup
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'desktop-v9.0-beta-' + '${{ github.sha }}'.Substring(0,7)
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --target ${{ github.sha }} --title 'EvoluFisico Desktop 9.0 beta (Windows)' --notes 'Versao de testes para Windows x64. Instalador e pacote portatil. Faca backup antes de usar dados reais.' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub release' }
          }
          $installer = Get-ChildItem installer-output -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Setup EXE missing' }
          gh release upload $tag $installer.FullName --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer to GitHub release' }
          Write-Host "Release available at https://github.com/${{ github.repository }}/releases/tag/$tag"
