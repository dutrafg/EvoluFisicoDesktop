name: Windows Desktop Build
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate frontend and resource references
        shell: pwsh
        run: python scripts/verify_frontend.py

      - name: Validate imported assessment forms and native SQLite safeguards
        run: node tests/forms-windows-integration.cjs

      - name: Validate desktop integrations
        shell: pwsh
        run: node tests/desktop-integration.cjs

      - name: Validate notification settings without vibration
        run: node tests/notifications-no-vibration.cjs

      - name: Validate branded installer shortcut configuration
        run: node tests/installer-icon.cjs

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Protect legacy evaluation, billing and master password compatibility
        run: node tests/legacy-vault-compatibility.cjs

      - name: Validate desktop sidebar palette
        run: node tests/sidebar-palette.cjs

      - name: Run 34 Windows stability safety gates
        run: node tests/windows-stable-gates.cjs

      - name: Regression test for 9.1 billing navigation and responsive menu
        run: node tests/windows-billing-navigation-91.cjs

      - name: Regression tests for Windows assessment saving and receiving pending payments
        run: node tests/windows-assessment-billing-regression.cjs

      - name: Validate encrypted storage, privacy and compact desktop layout
        run: node tests/windows-privacy-layout.cjs

      - name: Validate desktop 1.0 analysis migration and stability gates
        run: node tests/windows-stable-1-0.cjs

      - name: Validate Evolufisico2 sync (adherence, history and perimetry)
        run: node tests/windows-sync-evolufisico2-1-0.cjs
      - name: Validate 2026-10-22 history folders and PDF cancellation
        run: node tests/windows-sync-20261022.cjs
      - name: Validate Evolufisico2 1.0.4 sync and +20% Desktop visual effects
        run: node tests/windows-sync-1-0-4.cjs
      - name: Validate new SVG icons, menu preservation and 1.0.6
        run: node tests/windows-svg-icons-1-0-5.cjs
      - name: Validate Evolufisico2 1.0.31 persistence, reload guard and billing fixes
        run: node tests/windows-sync-1-0-31.cjs
      - name: Validate 1.0.7 novidades card and release identity
        run: node tests/windows-whats-new-1-0-7.cjs
      - name: Validate Evolufisico2 1.0.33 PDF filenames and contextual Nova avaliação
        run: node tests/windows-sync-1-0-33.cjs

      - name: Validate legacy desktop features and preregistration
        run: node tests/windows-release-911-beta4.cjs

      - name: Test home card reordering, full-width dashboard and header clarity
        run: node tests/windows-home-layout.cjs

      - name: Validate agenda summary, quick-add button and full-width forms
        run: node tests/windows-agenda-home-summary.cjs

      - name: Validate return interval and bounded performance caches
        run: node tests/windows-performance-reassessment.cjs

      - name: Test recurring agenda, attendance indicators and safe CSV export
        run: node tests/windows-agenda-recorrencia.cjs

      - name: Verify per-card width, height, drag handles and saved layout
        run: node tests/windows-card-resize.cjs

      - name: Validate SQLite-only frontend syntax
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/05-app-runtime.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/24-billing.js
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/28-native-storage.js

      - name: Test desktop SQLite JavaScript bridge
        run: node tests/native-storage-client.cjs

      - name: Run native encrypted SQLite integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/StorageSmoke/StorageSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted SQLite integration tests failed' }

      - name: Verify Windows application icon
        shell: pwsh
        run: |
          $ico = 'src/EvoluFisico.Desktop/Assets/EvoluFisico.ico'
          if (!(Test-Path $ico)) { throw 'Windows icon was not generated' }
          $bytes = [IO.File]::ReadAllBytes($ico)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Invalid Windows ICO file'
          }
          $exe = 'publish/win-x64/EvoluFisico.Desktop.exe'
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if (-not $icon) { throw 'Windows EXE icon missing' }
          $icon.Dispose()
          Write-Host 'Windows icon resources verified'

      - name: Test packaged offline assets and print cleanup
        shell: pwsh
        working-directory: publish/win-x64/wwwroot
        run: |
          node ../../../tests/service-worker.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Service Worker regression failed' }
          node ../../../tests/print-cleanup.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Print regression failed' }
          node ../../../tests/flows-regression.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation, PDF and backup flow regression failed' }

      - name: Verify executable and resources
        shell: pwsh
        run: |
          $publish = 'publish/win-x64'
          foreach ($file in @('EvoluFisico.Desktop.exe','wwwroot/index.html','wwwroot/evolufisico.html','wwwroot/icon-192.png','wwwroot/icon-512.png','wwwroot/sw.js','wwwroot/desktop-version.json')) {
            if (!(Test-Path (Join-Path $publish $file))) { throw "Missing published file: $file" }
          }
          $manifest = Get-Content (Join-Path $publish 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          $expected = 'desktop-v1.0-' + '${{ github.sha }}'.Substring(0,7)
          if ($manifest.tag -ne $expected) { throw "Version manifest mismatch: $($manifest.tag) vs $expected" }
          Write-Host 'Portable Windows application validated for packaging'

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-1.0-Windows-Portable
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup not found: $iscc" }
          & $iscc installer/EvoluFisico.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-output -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not generated' }
          if ($installer.Length -lt 100KB) { throw 'Installer is unexpectedly small' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          Write-Host "Installer ready: $($installer.Name) ($($installer.Length) bytes)"

      - name: Smoke test silent installation and removal
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter '*.exe' -File | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'EvoluFisicoDesktopSmoke'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          foreach ($file in @('EvoluFisico.Desktop.exe','wwwroot/index.html','wwwroot/sw.js','wwwroot/desktop-version.json')) {
            if (!(Test-Path (Join-Path $target $file))) { throw "Installed file missing: $file" }
          }
          $installedVersion = Get-Content (Join-Path $target 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          $expectedVersion = 'desktop-v1.0-' + '${{ github.sha }}'.Substring(0,7)
          if ($installedVersion.tag -ne $expectedVersion) { throw 'Installed version does not match release version' }
          $installedIcon = Join-Path $target 'EvoluFisico.ico'
          if (!(Test-Path $installedIcon)) { throw 'Installed application icon missing' }
          if ((Get-Item $installedIcon).Length -lt 1024) { throw 'Installed icon is unexpectedly small' }
          $shell = New-Object -ComObject WScript.Shell
          $desktopPaths = @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('CommonDesktopDirectory'))
          $links = @($desktopPaths | ForEach-Object { Join-Path $_ 'EvoluFisico Desktop.lnk' } | Where-Object { Test-Path $_ })
          if ($links.Count -eq 0) { throw 'Desktop shortcut was not created by installer' }
          foreach ($link in $links) {
            $shortcut = $shell.CreateShortcut($link)
            if ($shortcut.IconLocation -notlike '*EvoluFisico.ico*') { throw "Desktop shortcut uses unexpected icon: $($shortcut.IconLocation)" }
            if ($shortcut.TargetPath -ne (Join-Path $target 'EvoluFisico.Desktop.exe')) { throw 'Desktop shortcut points to unexpected executable' }
          }
          Write-Host 'Desktop shortcut target and custom ICO verified'
          $uninstaller = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed: $($remove.ExitCode)" }
          Write-Host 'Silent installation and uninstall smoke tests passed'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-1.0-Windows-Setup
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable 1.0 Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'desktop-v1.0-' + '${{ github.sha }}'.Substring(0,7)
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --target ${{ github.sha }} --title 'EvoluFisico Desktop 1.0 estável (Windows)' --notes 'Versao 1.0 estavel Windows x64 com Analises EF68/EF70/EF77. Recomendado backup antes de atualizar.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub release' }
          }
          $installer = Get-ChildItem installer-output -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Setup EXE missing' }
          gh release upload $tag $installer.FullName --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer to GitHub release' }
          Write-Host "Release available at https://github.com/${{ github.repository }}/releases/tag/$tag"
