name: Windows Desktop Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify frontend
        shell: pwsh
        run: |
          if (!(Test-Path 'src/EvoluFisico.Desktop/wwwroot/index.html')) {
            throw 'Frontend 9.0 missing. Installer cannot be built yet.'
          }
      - name: Validate frontend scripts and assets
        shell: pwsh
        run: python scripts/verify_frontend.py
      - name: Publish win-x64
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Regression tests (offline and print cleanup)
        shell: pwsh
        working-directory: publish/win-x64/wwwroot
        run: |
          node ../../../tests/service-worker.cjs
          node ../../../tests/print-cleanup.cjs
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\EvoluFisico.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-9.0-Windows-Setup
          path: installer-output/*.exe
          if-no-files-found: error
