name: EFI AI Alpha Build Validation
on:
  push:
    branches:
      - feature/efi-qwen35-2b-alpha
  workflow_dispatch:
concurrency:
  group: efi-alpha-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate EFI javascript syntax
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/efia/efi-ai-panel.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid EFI JavaScript' }
      - name: Test unified student profile and theme regression
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/68-unified-students-core.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid student profile core JavaScript' }
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/68-unified-students.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid student profile JavaScript' }
          node tests/unified-students-profile.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Unified student profile tests failed' }
      - name: Test six-step evaluation and objective persistence
        shell: pwsh
        run: |
          node tests/evaluation-objectives.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation objective flow tests failed' }
      - name: Test explicit safe legacy identity migration
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/04-data-integrity.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid identity JavaScript' }
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/05-app-runtime.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid application runtime JavaScript' }
          node tests/client-identity-migration.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Legacy identity migration tests failed' }
      - name: Run 10000 integrated EFIA synthetic scenarios
        shell: pwsh
        run: |
          node --check tests/efia-integration-10000.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Invalid integrated EFIA test JavaScript' }
          node tests/efia-integration-10000.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Integrated EFIA synthetic scenarios failed' }
      - name: Run 30000 official-source EFIA campaign
        shell: pwsh
        run: |
          node --check tests/efia-campaign-30000.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Invalid 30000 EFIA campaign test JavaScript' }
          node tests/efia-campaign-30000.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Official-source 30000 EFIA campaign failed' }
      - name: Test encrypted SQLite transactions, migration and recovery
        shell: pwsh
        run: |
          dotnet run --project tests/StorageSmoke/StorageSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted SQLite smoke tests failed' }
      - name: Run forms, native storage and assessment regressions
        shell: pwsh
        run: |
          node tests/forms-windows-integration.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows forms integration tests failed' }
          node tests/native-storage-client.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native storage client tests failed' }
          node tests/windows-assessment-billing-regression.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows assessment/billing regressions failed' }
      - name: Run Home, agenda, touch, privacy and palette regressions
        shell: pwsh
        run: |
          node tests/windows-agenda-home-summary.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Agenda/home summary tests failed' }
          node tests/windows-agenda-recorrencia.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Agenda recurrence tests failed' }
          node tests/windows-home-layout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Home layout tests failed' }
          node tests/windows-card-resize.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Home card resize tests failed' }
          node tests/windows-touch-scroll-1-0-11.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Touch scroll tests failed' }
          node tests/windows-privacy-layout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Privacy layout tests failed' }
          node tests/sidebar-palette.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Sidebar palette tests failed' }
      - name: Test stale analysis report invalidation
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/js/42-analysis-reports.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid analysis report editor JavaScript' }
          node tests/analysis-report-staleness.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Stale analysis report test failed' }
      - name: Validate four fictional student histories and EFIA eligibility
        shell: pwsh
        run: |
          node tests/efi-demo-fixtures.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Demo series validation failed' }
          node tests/windows-home-editor-1-0-12.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Stable Desktop 1.0.12 Home editor integration failed' }
      - name: Build complete Windows Desktop with EFI modules
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -EfiAlpha
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Verify EFI integration and unchanged version
        shell: pwsh
        run: |
          node tests/efi-ai-alpha.cjs
          if ($LASTEXITCODE -ne 0) { throw 'EFI alpha integration failed' }
      - name: Test EFI student chat and encrypted history
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/efia/efi-ai-panel.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid EFI chat UI JavaScript' }
          node --check tests/efi-ai-chat.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Invalid EFI chat test JavaScript' }
          node tests/efi-ai-chat.cjs
          if ($LASTEXITCODE -ne 0) { throw 'EFI chat and history checks failed' }
      - name: Bundle verified native CPU inference engine
        shell: pwsh
        run: |
          ./scripts/bundle-efi-runtime.ps1
          if (!(Test-Path 'publish/win-x64/ai-runtime/llama-server.exe')) { throw 'Missing llama-server.exe' }
      - name: Build dedicated EFI Alpha installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup not found: $iscc" }
          & $iscc installer/EvoluFisico-EFI-Alpha.iss
          if ($LASTEXITCODE -ne 0) { throw 'Alpha setup creation failed' }
          $setup = Get-ChildItem installer-output -Filter 'EvoluFisico_EFI_Alpha_Setup.exe' -File | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 20MB) { throw 'Alpha installer missing or too small' }
      - name: Smoke-test Alpha installer isolation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter 'EvoluFisico_EFI_Alpha_Setup.exe' -File | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'EvoluFisicoEFIAlphaSmoke'
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Alpha install failed: $($result.ExitCode)" }
          foreach ($part in @('EvoluFisico.Desktop.exe','wwwroot/index.html','wwwroot/desktop-version.json','ai-runtime/llama-server.exe','wwwroot/assets/efia/efi-ai-panel.js','wwwroot/assets/efia/efi-demo-students.json')) {
            if (!(Test-Path (Join-Path $target $part))) { throw "Missing installation file: $part" }
          }
          $manifest = Get-Content (Join-Path $target 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'efi-alpha' -or $manifest.version -ne '1.0.14-alpha') { throw 'Installer shipped stable channel instead of isolated Alpha' }
          $appExe = Join-Path $target 'EvoluFisico.Desktop.exe'
          $app = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw 'Alpha Desktop exited during startup smoke test' }
          $app.CloseMainWindow() | Out-Null
          if (!$app.WaitForExit(5000)) { $app.Kill(); $app.WaitForExit() }
          $uninstaller = Join-Path $target 'unins000.exe'
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Alpha uninstall failed' }
          Write-Host 'Alpha process startup, install/uninstall and isolated version smoke test passed'
      - name: Upload experimental Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisico_EFI_Alpha_Setup
          path: installer-output/EvoluFisico_EFI_Alpha_Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Avoid publishing experimental build
        shell: pwsh
        run: |
          Write-Host 'Validation only: no release, no main push, no production deployment.'
