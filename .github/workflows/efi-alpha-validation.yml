name: EFI AI Alpha Build Validation
on:
  push:
    branches:
      - feature/efi-qwen35-2b-alpha
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate EFI javascript syntax
        shell: pwsh
        run: |
          node --check src/EvoluFisico.Desktop/wwwroot/assets/efia/efi-ai-panel.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid EFI JavaScript' }
      - name: Build complete Windows Desktop with EFI modules
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Verify EFI integration and unchanged version
        shell: pwsh
        run: |
          node tests/efi-ai-alpha.cjs
          if ($LASTEXITCODE -ne 0) { throw 'EFI alpha integration failed' }
      - name: Bundle verified native CPU inference engine
        shell: pwsh
        run: |
          ./scripts/bundle-efi-runtime.ps1
          if (!(Test-Path 'publish/win-x64/ai-runtime/llama-server.exe')) { throw 'Missing llama-server.exe' }
      - name: Upload experimental Windows application files
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-1.0.12-EFI-Alpha-Windows-files
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Avoid publishing experimental build
        shell: pwsh
        run: |
          Write-Host 'Validation only: no release, no main push, no production deployment.'
