name: Linux GTK4 Preview
on:
  push:
    branches: [linux-gtk4]
    paths:
      - 'linux/**'
      - '.github/workflows/linux-gtk4.yml'
  workflow_dispatch:
jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build pkg-config libgtk-4-dev libsqlcipher-dev
      - name: Check source for unsafe SQL string formatting
        run: |
          if grep -nE 'sqlite3_exec\([^,]*, *g_strdup_printf|sqlite3_exec\([^,]*, *sprintf' linux/src/storage.c; then exit 1; fi
      - name: Guard against deprecated client picker APIs
        run: |
          if grep -nE 'gtk_combo_box_|gtk_combo_box_text_' linux/src/main.c; then
            echo 'Legacy GTK4 client picker API found'
            exit 1
          fi
      - name: Compile and package
        run: bash linux/package-deb.sh
      - name: Test native SQLite operations
        run: meson test -C linux/build --print-errorlogs
      - name: Compile with strict warnings
        run: |
          meson setup linux/build-strict linux --buildtype=debug -Dwerror=true -Dc_args=-Wno-error=deprecated-declarations
          meson compile -C linux/build-strict
          meson test -C linux/build-strict --print-errorlogs
      - name: Verify Debian package contents
        run: |
          dpkg-deb --contents linux/dist/*.deb | tee /tmp/evolufisico-deb-files.txt
          grep -q 'usr/bin/evolufisico-linux' /tmp/evolufisico-deb-files.txt
          grep -q 'usr/share/applications/br.com.evolufisico.desktop' /tmp/evolufisico-deb-files.txt
      - name: Upload Debian preview
        uses: actions/upload-artifact@v4
        with:
          name: evolufisico-linux-gtk4-deb
          path: linux/dist/*.deb
