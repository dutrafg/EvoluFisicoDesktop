name: EvoluFisico Desktop 3.1.45 - Windows x64 Main
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/verify_web_3_1_45.py'
      - 'tests/windows-web-3-1-45-rc14.cjs'
      - 'tests/native-storage-client.cjs'
      - 'tests/StorageSmoke/**'
      - '.github/workflows/desktop-main-3-1-45.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolufisico-desktop-main-3145
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar frontend 3.1.45, recursos e WebView2
        shell: pwsh
        run: |
          python scripts/verify_web_3_1_45.py
          if ($LASTEXITCODE -ne 0) { throw 'Frontend Desktop 3.1.45 invalido' }
          node tests/windows-web-3-1-45-rc14.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos testes de historico, PDF ou SQLite nativo' }
          node tests/native-storage-client.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Bridge SQLite falhou' }
      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testar armazenamento SQLite cifrado
        shell: pwsh
        run: |
          dotnet run --project tests/StorageSmoke/StorageSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'SQLite nativo falhou' }
      - name: Publicar Windows nativo x64
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao .NET Windows falhou' }
          $v = Get-Content publish/win-x64/wwwroot/desktop-version.json -Raw | ConvertFrom-Json
          if ($v.version -ne '3.1.45' -or $v.source_web_version -ne '3.1.45') { throw 'Versao compilada divergente' }
          if ($v.source_web_commit -ne '2e80aa6220ebaaf9430e387e2f7cbde324f918de') { throw 'Origem web incorreta' }
          if (!(Test-Path publish/win-x64/EvoluFisico.Desktop.exe)) { throw 'EXE ausente' }
      - name: Instalar Inno Setup e construir instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup nao instalado' }
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          & $iscc installer/EvoluFisico.iss
          if ($LASTEXITCODE -ne 0) { throw 'Erro ao criar instalador EXE' }
          $setup = (Get-ChildItem installer-output -Filter 'EvoluFisicoDesktop-3.1.45-FrontendCompleto-Setup.exe' -File | Select-Object -First 1).FullName
          if (-not $setup) { throw 'Instalador inexistente' }
      - name: Validar instalacao e desinstalacao em area descartavel
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-output -Filter 'EvoluFisicoDesktop-3.1.45-FrontendCompleto-Setup.exe' -File | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'EvoluFisicoDesktop-3145-CI'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Instalacao falhou: $($p.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'EvoluFisico.Desktop.exe'))) { throw 'EXE instalado ausente' }
          $manifest = Get-Content (Join-Path $target 'wwwroot/desktop-version.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '3.1.45') { throw 'Instalador incluiu versao errada' }
          if (!(Test-Path (Join-Path $target 'wwwroot/assets/js/28-native-storage.js'))) { throw 'Ponte nativa ausente' }
          $un = Join-Path $target 'unins000.exe'
          if (!(Test-Path $un)) { throw 'Desinstalador ausente' }
          $q = Start-Process -FilePath $un -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($q.ExitCode -ne 0) { throw "Desinstalacao falhou: $($q.ExitCode)" }
      - name: Publicar instalador de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisicoDesktop-Main-3.1.45-Windows-x64-Setup
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 30
